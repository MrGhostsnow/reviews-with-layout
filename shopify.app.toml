# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "57086c819ef5dbe6c9fb7500ab45ee88"
name = "FlexReviews"
application_url = "https://reviews-api-production-10bf.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://reviews-api-production-10bf.up.railway.app/webhooks"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "https://reviews-api-production-10bf.up.railway.app/webhooks"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_app_proxy"
# Explicit false so new installs (and reinstalls) go through the modern OAuth
# grant and get an expiring offline token via token exchange, instead of the
# legacy grant that issues a non-expiring one. This app's remote config
# predates this setting, so it was defaulting to the legacy flow on
# Shopify's side even with no key present locally — confirmed by production
# logs: token exchange kept returning hasExpiresIn: false even after a full
# uninstall+reinstall of the app on the shop. Requires `shopify app deploy`
# to actually take effect (this file alone isn't read by Shopify's servers).
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://reviews-api-production-10bf.up.railway.app/api/auth/callback",
  "https://reviews-api-production-10bf.up.railway.app/api/billing/confirm"
]

[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read review data and ratings for store products"

[app_proxy]
url = "https://reviews-api-production-10bf.up.railway.app"
subpath = "reviews"
prefix = "apps" 
 